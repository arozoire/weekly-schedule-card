# Weekly Schedule Card — Quick Timer server support
#
# Required because a frontend card cannot delete a Home Assistant automation after every
# dashboard/browser has been closed. See README.md for installation and secrets.yaml values.

rest_command:
  wsc_quick_timer_delete_automation:
    url: "http://127.0.0.1:8123/api/config/automation/config/{{ automation_id }}"
    method: DELETE
    headers:
      Authorization: !secret wsc_qt_authorization
    content_type: "application/json"
    timeout: 10

script:
  wsc_quick_timer_cleanup:
    alias: WSC Quick Timer cleanup
    description: Deletes a completed or superseded Quick Timer automation.
    mode: parallel
    max: 20
    fields:
      automation_id:
        name: Automation ID
        required: true
        selector:
          text:
      run_id:
        name: Run ID
        required: false
        selector:
          text:
    sequence:
      # Let the calling automation finish its own restore/takeover branch before deletion.
      - delay: "00:00:01"
      - repeat:
          count: 5
          sequence:
            - service: rest_command.wsc_quick_timer_delete_automation
              data:
                automation_id: "{{ automation_id }}"
              response_variable: delete_response
              continue_on_error: true
            - if:
                - condition: template
                  value_template: >-
                    {{ delete_response is defined and
                       delete_response.status in [200, 204, 404] }}
              then:
                - stop: "Quick Timer automation deleted"
            - delay: "00:00:02"
      - service: system_log.write
        data:
          level: error
          message: >-
            WSC Quick Timer cleanup failed for {{ automation_id }}
            (run {{ run_id | default('unknown', true) }}). The automation was left in place.
