<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 452" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f9fb"/>
    </linearGradient>
    <linearGradient id="clima" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A65"/><stop offset="1" stop-color="#F4511E"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#9aa7b3" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="364" height="436" rx="22" fill="url(#bg)" filter="url(#cardShadow)"/>

  <!-- header + legenda 3 entità -->
  <text x="26" y="38" font-size="15" font-weight="700" fill="#28323c">Zona giorno · settimana</text>
  <g font-size="10.5" font-weight="600">
    <rect x="26" y="50" width="9" height="9" rx="2.5" fill="#F4511E"/><text x="40" y="58" fill="#5a6772">Clima</text>
    <rect x="92" y="50" width="9" height="9" rx="2.5" fill="#FDD835"/><text x="106" y="58" fill="#5a6772">Luce</text>
    <rect x="150" y="50" width="9" height="9" rx="2.5" fill="#EF5350"/><text x="164" y="58" fill="#5a6772">Caldaia</text>
  </g>

  <!-- nastro continuo (boustrophedon): mezzanotte = apice delle curve (senza marker, si legge dalle curve) -->
  <path d="M58,112 L322,112 C352,112 352,158 322,158 L58,158 C28,158 28,204 58,204 L322,204
           C352,204 352,250 322,250 L58,250 C28,250 28,296 58,296 L322,296
           C352,296 352,342 322,342 L58,342 C28,342 28,388 58,388 L322,388"
        fill="none" stroke="#edf1f4" stroke-width="28" stroke-linecap="round"/>

  <!-- etichette giorno (centrate sulla riga = da mezza curva a mezza curva) -->
  <g font-size="10" font-weight="700" fill="#aeb9c4">
    <text x="18" y="116">L</text><text x="18" y="162">M</text><text x="18" y="208">M</text>
    <text x="18" y="254">G</text><text x="18" y="300">V</text><text x="18" y="346">S</text><text x="18" y="392">D</text>
  </g>

  <!-- pillole schedule: 3 sotto-corsie per riga (Clima y-9 · Luce y · Caldaia y+9) -->
  <g>
    <rect x="118" y="100" width="86" height="7" rx="3.5" fill="url(#clima)"/>
    <rect x="250" y="109" width="64" height="7" rx="3.5" fill="#FDD835"/>
    <rect x="92"  y="118" width="52" height="7" rx="3.5" fill="#EF5350"/>

    <rect x="100" y="146" width="78" height="7" rx="3.5" fill="url(#clima)"/>
    <rect x="240" y="155" width="74" height="7" rx="3.5" fill="#FDD835"/>

    <rect x="126" y="192" width="140" height="7" rx="3.5" fill="url(#clima)"/>
    <rect x="240" y="201" width="74" height="7" rx="3.5" fill="#FDD835"/>
    <rect x="92"  y="210" width="52" height="7" rx="3.5" fill="#EF5350"/>

    <rect x="170" y="238" width="120" height="7" rx="3.5" fill="url(#clima)"/>
    <rect x="240" y="247" width="74" height="7" rx="3.5" fill="#FDD835"/>

    <rect x="92"  y="284" width="60" height="7" rx="3.5" fill="url(#clima)"/>
    <rect x="236" y="284" width="64" height="7" rx="3.5" fill="url(#clima)"/>
    <rect x="250" y="293" width="64" height="7" rx="3.5" fill="#FDD835"/>
    <rect x="92"  y="302" width="52" height="7" rx="3.5" fill="#EF5350"/>

    <rect x="120" y="330" width="160" height="7" rx="3.5" fill="url(#clima)"/>
    <rect x="250" y="339" width="64" height="7" rx="3.5" fill="#FDD835"/>

    <rect x="150" y="376" width="96" height="7" rx="3.5" fill="url(#clima)"/>
    <rect x="92"  y="394" width="52" height="7" rx="3.5" fill="#EF5350"/>
  </g>

  <!-- linea "ORA": sottile, perpendicolare al nastro sul giorno corrente (GIO) -->
  <g opacity="0.85">
    <line x1="228.5" y1="235" x2="228.5" y2="265" stroke="#5b6b7a" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="228.5" cy="235" r="2.4" fill="#5b6b7a"/>
  </g>
</svg>
