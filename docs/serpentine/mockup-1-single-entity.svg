<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 412" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f9fb"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB74D"/>
      <stop offset="1" stop-color="#FB8C00"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7043"/>
      <stop offset="1" stop-color="#F4511E"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#9aa7b3" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#F4511E" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="8" y="8" width="364" height="396" rx="22" fill="url(#bg)" filter="url(#cardShadow)"/>

  <!-- header -->
  <circle cx="40" cy="44" r="14" fill="#FFF1E8"/>
  <text x="40" y="50" font-size="15" text-anchor="middle">🌡️</text>
  <text x="64" y="40" font-size="15" font-weight="700" fill="#28323c">Camera — Clima</text>
  <text x="64" y="57" font-size="11.5" fill="#8a97a3">Riscaldamento · ora 21°C</text>
  <g>
    <circle cx="322" cy="42" r="4.5" fill="#43A047"/>
    <text x="333" y="46" font-size="11" font-weight="600" fill="#43A047">attivo</text>
  </g>

  <!-- serpentine track (one continuous ribbon, rounded U-turns) -->
  <path d="M56,96 L324,96 C356,96 356,140 324,140 L56,140 C24,140 24,184 56,184 L324,184
           C356,184 356,228 324,228 L56,228 C24,228 24,272 56,272 L324,272
           C356,272 356,316 324,316 L56,316 C24,316 24,360 56,360 L324,360"
        fill="none" stroke="#eaeef2" stroke-width="18" stroke-linecap="round"/>

  <!-- day labels -->
  <g font-size="10.5" font-weight="700" fill="#aeb9c4" text-anchor="middle">
    <text x="40" y="100">LUN</text>
    <text x="40" y="144">MAR</text>
    <text x="40" y="188">MER</text>
    <text x="40" y="232">GIO</text>
    <text x="40" y="276">VEN</text>
    <text x="40" y="320">SAB</text>
    <text x="40" y="364">DOM</text>
  </g>

  <!-- schedule pills (colored segments along the ribbon) -->
  <g>
    <!-- LUN -->
    <rect x="110" y="90" width="78" height="12" rx="6" fill="url(#warm)"/>
    <rect x="236" y="90" width="78" height="12" rx="6" fill="url(#hot)"/>
    <!-- MAR -->
    <rect x="92"  y="134" width="96" height="12" rx="6" fill="url(#warm)"/>
    <!-- MER -->
    <rect x="120" y="178" width="150" height="12" rx="6" fill="url(#hot)"/>
    <!-- GIO -->
    <rect x="190" y="222" width="104" height="12" rx="6" fill="url(#warm)"/>
    <!-- VEN -->
    <rect x="80"  y="266" width="70" height="12" rx="6" fill="url(#warm)"/>
    <rect x="226" y="266" width="92" height="12" rx="6" fill="url(#hot)"/>
    <!-- SAB -->
    <rect x="104" y="310" width="170" height="12" rx="6" fill="url(#warm)"/>
    <!-- DOM (active now) -->
    <rect x="150" y="352" width="96" height="16" rx="8" fill="url(#hot)" filter="url(#glow)"/>
  </g>

  <!-- time ticks -->
  <g font-size="8.5" fill="#c2ccd4" text-anchor="middle">
    <text x="56" y="392">00</text>
    <text x="123" y="392">06</text>
    <text x="190" y="392">12</text>
    <text x="257" y="392">18</text>
    <text x="324" y="392">24</text>
  </g>
</svg>
