name: Card and controller tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - run: node tests/quick-timer-card.test.mjs
      - run: node tests/conditional-card.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.63.0
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
        env:
          WSC_TEST_SCREENSHOT: quick-timer-linear.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-timer-ui
          path: quick-timer-linear*.png
          if-no-files-found: ignore

  conditional-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install homeassistant==2026.9.1
      - run: node tests/conditional-fixtures.mjs /tmp/wsc-conditional-fixtures.json
      - run: python tests/conditional-controller-ha.py /tmp/wsc-conditional-fixtures.json
