name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.3.2)'
        required: true
        default: 'v1.3.2'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: |
            dist/weekly-schedule-card.js
            dist/weekly-schedule-view-card.js
            dist/quick-timer-card.js
            dist/weekly-serpentine-card.js
          body: |
            ## ${{ github.event.inputs.version }} — fix quick-timer: countdown fedele alla durata reale

            ### Fix quick-timer
            - **`automation.trigger` bloccava per l'intera durata del timer**: chiamare quel
              servizio per far partire l'automazione del timer aspetta che TUTTA la sua sequenza
              di azioni finisca — compreso il `delay` interno della durata scelta (comportamento
              noto di Home Assistant, diverso da un trigger reale che gira in background). La card
              restava su "Stato acquisito" per l'intera durata, poi mostrava un secondo countdown
              fittizio della stessa durata, mentre il ripristino era già avvenuto durante l'attesa.
              Ora la chiamata è in corsa con un timeout breve (2.5s): un errore vero (entità
              sbagliata, ecc.) viene comunque intercettato subito come prima, ma il countdown
              corretto compare da subito invece di aspettare tutta la durata; un fallimento tardivo
              (raro) viene comunque ripulito in background.
            - **Helper di storage "_meta" duplicati**: un controllo che doveva riconoscere gli
              helper `input_text` già esistenti non riconosceva mai quello "_meta" → ad ogni
              refresh di pagina + salvataggio ne veniva creato uno nuovo, accumulando duplicati
              orfani nel tempo. Ora riconosciuto correttamente; gli helper duplicati già creati in
              passato vanno rimossi manualmente da Impostazioni → Helper.
            - Messaggi d'errore del timer ora leggibili direttamente in Console (niente più oggetti
              compressi da dover espandere a mano).

            ### Aggiornare
            - **HACS**: Update → Ctrl-F5.
            - **Manuale**: scarica `weekly-schedule-card.js` (Assets) → in `/config/www/` → Ctrl-F5.
