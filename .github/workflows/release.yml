name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.8)'
        required: true
        default: 'v1.2.8'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: |
            dist/weekly-schedule-card.js
            dist/weekly-schedule-view-card.js
            dist/quick-timer-card.js
          body: |
            ## ${{ github.event.inputs.version }} — fix regressione popup climate

            Patch urgente sopra la v1.2.7.

            ### Fix
            - **Regressione**: creare/modificare uno schedule **climate** (qualsiasi azione
              con temperatura) non rispondeva — i controlli del popup risultavano "morti".
              Causa: `updateTempUI` (in `_bindPopupEvents`) referenziava `tempBounds`,
              definito in un altro metodo (`_renderPopup`) → ReferenceError a runtime che
              abortiva il binding di tutti i listener successivi. Introdotta in v1.2.6 con
              i nuovi domini. `tempBounds` ora è calcolato localmente.

            ### Aggiornare
            - **HACS**: Update → Ctrl-F5.
            - **Manuale**: scarica `weekly-schedule-card.js` (Assets) → in `/config/www/` → Ctrl-F5.
