name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.3.1)'
        required: true
        default: 'v1.3.1'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: |
            dist/weekly-schedule-card.js
            dist/weekly-schedule-view-card.js
            dist/quick-timer-card.js
            dist/weekly-serpentine-card.js
          body: |
            ## ${{ github.event.inputs.version }} — 🐍 weekly-serpentine-card

            ### Novità
            - **Nuova card decorativa `weekly-serpentine-card`**: mostra l'intera settimana come
              un nastro continuo a serpentina (boustrophedon vero: lun →, mar ←, mer →, …
              collegate da curve a U — mezzanotte cade nell'apice, senza tacche orarie).
            - **Multi-entità**: ogni entità è una sotto-corsia parallela con colore proprio +
              legenda in alto; avviso soft (non un limite rigido) oltre 3 entità.
            - **Indicatore "ora" sottile** sul giorno corrente. Pillole = schedule; click →
              apre lo **stesso popup di modifica** delle altre card (giorni/slot/azioni/
              condizioni/notifiche), non solo un more-info.
            - Blocchi a cavallo di mezzanotte ora "fluiscono" visivamente dentro la curva invece
              di fermarsi di netto sul bordo.
            - Inclusa nel bundle principale (HACS) e disponibile anche come bundle standalone
              `weekly-serpentine-card.js`.

            ### Fix quick-timer
            - Il countdown poteva sparire subito dopo "Avvia" (tornava il pulsante) e, ricaricando
              la pagina, il timer risultava "vuoto" come se non fosse mai partito. Causa: un
              refetch dello storage condiviso non protetto da un contatore di versione poteva
              leggere lo stato a metà scrittura e azzerare il timer appena creato.
            - L'automazione del timer, se finita disabilitata anche una sola volta (es. un
              "Annulla" il cui delete fallisce), restava disabilitata per sempre alle ricreazioni
              successive → il countdown non partiva mai più, bloccato su "Stato acquisito".
              Ora l'automazione viene sempre forzata abilitata alla ricreazione.

            ### Aggiornare
            - **HACS**: Update → Ctrl-F5.
            - **Manuale**: scarica `weekly-schedule-card.js` (Assets) → in `/config/www/` → Ctrl-F5.
