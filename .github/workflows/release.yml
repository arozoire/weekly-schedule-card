name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.7)'
        required: true
        default: 'v1.2.7'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: |
            dist/weekly-schedule-card.js
            dist/weekly-schedule-view-card.js
            dist/quick-timer-card.js
          body: |
            ## ${{ github.event.inputs.version }} — fix modifica schedule climate

            Patch sopra la v1.2.6 (che ha introdotto i domini lock / input_boolean /
            humidifier / water_heater).

            ### Fix
            - **Modifica** di uno schedule **climate hvac/preset-only** (senza temperatura)
              non funzionava sulla prima entità di un gruppo: durata e preset non
              modificabili/salvabili. `_openEditPopup` risolveva l'entità solo da
              `attributes.entities` (che lo Scheduler lascia vuoto per azioni hvac-only);
              ora la ricava anche dalle `actions`. Era rimasto fuori dalla v1.2.6 per via
              del timing del merge.

            ### Aggiornare
            - **HACS**: Update → Ctrl-F5.
            - **Manuale**: scarica `weekly-schedule-card.js` (Assets) → in `/config/www/` → Ctrl-F5.
