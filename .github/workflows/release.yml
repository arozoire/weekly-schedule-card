name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.9)'
        required: true
        default: 'v1.2.9'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: |
            dist/weekly-schedule-card.js
            dist/weekly-schedule-view-card.js
            dist/quick-timer-card.js
          body: |
            ## ${{ github.event.inputs.version }} — schedule "usa e getta" + feedback timer

            ### Novità
            - **Schedule usa e getta (one-shot)**: nuovo flag in creazione/modifica. Lo schedule
              gira sulla prossima occorrenza di ogni giorno scelto e poi **si elimina da solo**
              dopo l'ultima (es. lun/mar/ven → sparisce dopo il venerdì).

            ### Quick-timer
            - **Feedback onesto all'avvio** + blocco anti doppio-click: "Stato in acquisizione…"
              → "Stato acquisito: …" → countdown; errori chiari se qualcosa non parte.

            ### Aggiornare
            - **HACS**: Update → Ctrl-F5.
            - **Manuale**: scarica `weekly-schedule-card.js` (Assets) → in `/config/www/` → Ctrl-F5.
