name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.3.3)'
        required: true
        default: 'v1.3.3'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: |
            dist/weekly-schedule-card.js
            dist/weekly-schedule-view-card.js
            dist/quick-timer-card.js
            dist/weekly-serpentine-card.js
          body: |
            ## ${{ github.event.inputs.version }} — serpentine: la mezzanotte gira davvero nella curva

            ### Fix weekly-serpentine-card
            - **I blocchi a cavallo di mezzanotte ora fluiscono DENTRO la curva a U fino
              all'apice** (mezzanotte = apice della curva, come da design). Prima il blocco si
              estendeva solo di un piccolo margine oltre il bordo del nastro e si fermava di
              netto: due slot adiacenti a cavallo di mezzanotte (es. mer 23:25-00:00 +
              gio 00:01-00:45) sembravano due pillole staccate "prima e dopo" la curva. Ora la
              pillola segue la stessa curva del nastro: quella di fine giornata e quella di
              inizio della giornata dopo si incontrano esattamente all'apice e si leggono come
              un unico flusso continuo. Con più entità, ogni sotto-corsia gira in parallelo
              dentro la curva mantenendo il proprio colore. Inizio lunedì / fine domenica
              (dove il nastro non ha curva) restano invariati.

            ### Aggiornare
            - **HACS**: Update → Ctrl-F5.
            - **Manuale**: scarica `weekly-schedule-card.js` (Assets) → in `/config/www/` → Ctrl-F5.
