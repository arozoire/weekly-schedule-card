name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.3.4)'
        required: true
        default: 'v1.3.4'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: |
            dist/weekly-schedule-card.js
            dist/weekly-schedule-view-card.js
            dist/quick-timer-card.js
            dist/weekly-serpentine-card.js
          body: |
            ## ${{ github.event.inputs.version }} — serpentine: corsie da nastro vero, niente accavallamenti nelle curve

            ### Miglioria weekly-serpentine-card (multi-entità)
            - **L'ordine verticale delle entità ora si alterna a ogni riga**, come in un
              nastro fisico: lunedì 1ª entità sopra e 2ª sotto, martedì 2ª sopra e 1ª sotto,
              e così via (vale per qualunque numero di entità). Attraverso ogni curva a U la
              corsia esterna resta esterna e quella interna resta interna → **dentro le curve
              le corsie sono archi concentrici che non si accavallano più**. I blocchi a
              cavallo di mezzanotte continuano a incontrarsi all'apice della curva (v1.3.3),
              ora ciascuno sul proprio arco concentrico.

            ### Aggiornare
            - **HACS**: Update → Ctrl-F5.
            - **Manuale**: scarica `weekly-schedule-card.js` (Assets) → in `/config/www/` → Ctrl-F5.
