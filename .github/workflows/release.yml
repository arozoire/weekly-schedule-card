name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.3.5)'
        required: true
        default: 'v1.3.5'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: |
            dist/weekly-schedule-card.js
            dist/weekly-schedule-view-card.js
            dist/quick-timer-card.js
            dist/weekly-serpentine-card.js
          body: |
            ## ${{ github.event.inputs.version }} — 9 nuove lingue UI

            ### Internazionalizzazione
            - Aggiunte **9 lingue** all'interfaccia, oltre a inglese/italiano/francese:
              **spagnolo (es), portoghese (pt), tedesco (de), olandese (nl), polacco (pl),
              svedese (sv), norvegese (no), danese (da), ceco (cs)**. Rilevamento automatico
              dalla lingua di Home Assistant (o via `language:` nella config della card).
            - Scelta delle lingue basata sulla distribuzione geografica reale degli utenti HA
              (HA Analytics): coperti i maggiori bacini d'installazione non ancora inclusi.
            - Nessuna funzione esistente modificata: aggiunta puramente additiva alle stringhe.

            ### Aggiornare
            - **HACS**: Update → Ctrl-F5.
            - **Manuale**: scarica `weekly-schedule-card.js` (Assets) → in `/config/www/` → Ctrl-F5.
