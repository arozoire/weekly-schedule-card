name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.6)'
        required: true
        default: 'v1.2.6'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: |
            dist/weekly-schedule-card.js
            dist/weekly-schedule-view-card.js
            dist/quick-timer-card.js
          body: |
            ## ${{ github.event.inputs.version }} — nuovi domini controllabili

            Schedule, quick-timer card e selezione entità dei gruppi ora supportano
            **4 nuovi domini** oltre a climate/light/switch/fan/cover/valve:

            - **lock** — blocca/sblocca
            - **input_boolean** — on/off
            - **humidifier** — on/off + umidità + modalità
            - **water_heater** — temperatura + modalità operativa

            ### Fix
            - Modifica schedule **climate hvac/preset-only** (senza temperatura) ora funzionante
              anche sulla prima entità di un gruppo (durata/preset modificabili).

            ### Aggiornare
            - **HACS**: Update → Ctrl-F5.
            - **Manuale**: scarica `weekly-schedule-card.js` (Assets) → in `/config/www/` → Ctrl-F5.
